<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Audioguía · Cavernas de Sigsihuayco</title>
  <meta name="description" content="Audioguía cultural y geológica de las Cavernas de Sigsihuayco, Baños de Agua Santa.">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#0d1514">
  <style>
    :root {
      color-scheme: dark;
      --fondo: #07100e;
      --panel: rgba(15, 27, 24, .96);
      --claro: #f4f0e6;
      --suave: #b9c5c0;
      --ocre: #d2a25b;
      --borde: rgba(210, 162, 91, .34);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(55, 112, 100, .46), transparent 43%),
        linear-gradient(160deg, #101c1a 0%, var(--fondo) 58%, #040706 100%);
      color: var(--claro);
      font-family: Arial, Helvetica, sans-serif;
    }
    button, audio { font: inherit; }
    .shell { width: min(720px, 100%); margin: 0 auto; padding: 24px 16px 48px; }
    .top { display: grid; grid-template-columns: 70px 1fr; gap: 15px; align-items: center; }
    .logo {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .32);
    }
    .eyebrow {
      margin: 0 0 5px;
      color: var(--ocre);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font: 500 clamp(1.75rem, 7vw, 2.9rem)/1 Georgia, serif; }
    .language {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 22px 0;
      padding: 5px;
      border: 1px solid var(--borde);
      border-radius: 999px;
      background: rgba(0, 0, 0, .22);
    }
    .language button {
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--suave);
      font-weight: 800;
      cursor: pointer;
    }
    .language button[aria-pressed="true"] { background: var(--ocre); color: #17110a; }
    .card {
      overflow: hidden;
      border: 1px solid var(--borde);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 18px 52px rgba(0, 0, 0, .28);
    }
    .head { padding: 24px 22px 15px; }
    .number {
      display: inline-flex;
      margin-bottom: 12px;
      padding: 5px 10px;
      border: 1px solid rgba(210, 162, 91, .45);
      border-radius: 999px;
      color: var(--ocre);
      font-size: .69rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    h2 { margin: 0; font: 500 clamp(1.55rem, 6vw, 2.15rem)/1.13 Georgia, serif; }
    .place { margin: 10px 0 0; color: var(--suave); font-size: .91rem; line-height: 1.5; }
    .player { padding: 10px 22px 25px; }
    audio { display: block; width: 100%; min-height: 54px; color-scheme: dark; }
    .instruction, .empty {
      margin: 0;
      color: var(--suave);
      font-size: .92rem;
      line-height: 1.65;
    }
    .instruction {
      padding: 18px 22px 22px;
      border-top: 1px solid rgba(255, 255, 255, .07);
      background: rgba(4, 9, 8, .42);
    }
    .notice { margin-top: 18px; color: #869790; font-size: .72rem; line-height: 1.5; text-align: center; }
    .empty { padding: 26px 22px; }
    .empty strong { display: block; margin-bottom: 8px; color: var(--claro); font: 500 1.45rem/1.2 Georgia, serif; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <img class="logo" src="../assets/logo-sigsihuayco.jpeg" alt="Caverna Sigsihuayco">
      <div>
        <p class="eyebrow" id="brandLine">Recorrido cultural y geológico</p>
        <h1>Sigsihuayco</h1>
      </div>
    </header>

    <nav class="language" aria-label="Idioma / Language">
      <button id="lang-es" type="button" aria-pressed="true">Español</button>
      <button id="lang-en" type="button" aria-pressed="false">English</button>
    </nav>

    <section id="content" aria-live="polite"></section>
    <p class="notice" id="notice"></p>
  </main>

  <script>
    const stations = {
      "0": {
        label: { es: "Bienvenida", en: "Welcome" },
        title: { es: "Bienvenidos a Sigsihuayco", en: "Welcome to Sigsihuayco" },
        place: { es: "Punto de inicio del recorrido", en: "Starting point of the visit" },
        file: { es: "00-bienvenida.mp3", en: "00-welcome.mp3" }
      },
      "1": {
        label: { es: "Estación 1", en: "Station 1" },
        title: { es: "El jardín y Pachi", en: "The garden and Pachi" },
        place: { es: "Jardines de la propiedad", en: "The property gardens" },
        file: { es: "01-jardin-y-pachi.mp3", en: "01-garden-and-pachi.mp3" }
      },
      "2": {
        label: { es: "Estación 2", en: "Station 2" },
        title: { es: "Mirador del Pastaza", en: "The Pastaza viewpoint" },
        place: { es: "Vista al antiguo puente de San Francisco", en: "View of the old San Francisco bridge" },
        file: { es: "02-mirador-del-pastaza.mp3", en: "02-pastaza-viewpoint.mp3" }
      },
      "3": {
        label: { es: "Estación 3", en: "Station 3" },
        title: { es: "Un territorio geológico activo", en: "An active geological territory" },
        place: { es: "Antes del ingreso a la caverna", en: "Before entering the cavern" },
        file: { es: "03-territorio-geologico.mp3", en: "03-geological-territory.mp3" }
      },
      "4": {
        label: { es: "Estación 4", en: "Station 4" },
        title: { es: "Leer la caverna", en: "Reading the cavern" },
        place: { es: "Primer tramo interior", en: "First interior section" },
        file: { es: "04-leer-la-caverna.mp3", en: "04-reading-the-cavern.mp3" }
      },
      "5": {
        label: { es: "Estación 5", en: "Station 5" },
        title: { es: "La memoria de un nombre", en: "The memory of a name" },
        place: { es: "Sigsihuayco en la memoria de Baños", en: "Sigsihuayco in the memory of Baños" },
        file: { es: "05-memoria-del-nombre.mp3", en: "05-memory-of-the-name.mp3" }
      },
      "6": {
        label: { es: "Estación 6", en: "Station 6" },
        title: { es: "De la memoria a la leyenda", en: "From memory to legend" },
        place: { es: "Relatos de las grutas de Sigsihuayco", en: "Stories of the Sigsihuayco caves" },
        file: { es: "06-de-la-memoria-a-la-leyenda.mp3", en: "06-from-memory-to-legend.mp3" }
      },
      "7": {
        label: { es: "Estación 7", en: "Station 7" },
        title: { es: "La expedición", en: "The expedition" },
        place: { es: "Un camino hacia los Llanganates", en: "A path toward the Llanganates" },
        file: { es: "07-la-expedicion.mp3", en: "07-the-expedition.mp3" }
      },
      "8": {
        label: { es: "Estación 8", en: "Station 8" },
        title: { es: "El sobreviviente", en: "The survivor" },
        place: { es: "El desenlace de la leyenda", en: "The legend's conclusion" },
        file: { es: "08-el-sobreviviente.mp3", en: "08-the-survivor.mp3" }
      },
      "9": {
        label: { es: "Estación 9", en: "Station 9" },
        title: { es: "La recuperación de Sigsihuayco", en: "The recovery of Sigsihuayco" },
        place: { es: "Rosa Gamboa y la memoria viva del lugar", en: "Rosa Gamboa and the living memory of the place" },
        file: { es: "09-recuperacion-de-sigsihuayco.mp3", en: "09-recovery-of-sigsihuayco.mp3" }
      },
      "t": {
        label: { es: "Estación especial", en: "Special station" },
        title: { es: "El tesoro de Atahualpa", en: "Atahualpa's treasure" },
        place: { es: "Junto a la escultura de piedra", en: "Beside the stone sculpture" },
        file: { es: "especial-tesoro-de-atahualpa.mp3", en: "special-atahualpas-treasure.mp3" }
      }
    };

    const copy = {
      es: {
        brand: "Recorrido cultural y geológico",
        scanTitle: "La audioguía se activa con los QR",
        scanText: "Escanee el código ubicado en cada estación del recorrido. Cada QR abre únicamente el audio correspondiente a ese lugar.",
        invalidTitle: "Estación no disponible",
        invalidText: "Este enlace no corresponde a una estación activa. Escanee nuevamente el código QR instalado en el recorrido.",
        instruction: "Cuando termine este audio, continúe el recorrido y escanee el código QR de la próxima estación.",
        notice: "Contenido para escuchar durante la visita. No se autoriza su descarga, copia ni redistribución."
      },
      en: {
        brand: "Cultural and geological tour",
        scanTitle: "The audio guide is activated by QR codes",
        scanText: "Scan the code displayed at each point of the route. Every QR opens only the audio for that location.",
        invalidTitle: "Station unavailable",
        invalidText: "This link does not correspond to an active station. Please scan the QR code installed along the route again.",
        instruction: "When this audio ends, continue the visit and scan the QR code at the next station.",
        notice: "Content intended for listening during the visit. Downloading, copying, or redistribution is not authorized."
      }
    };

    const params = new URLSearchParams(window.location.search);
    const stationKey = params.get("s");
    let language = "es";

    function audioPath(item) {
      return `../audios/${language}/${item.file[language]}`;
    }

    function render() {
      const text = copy[language];
      const item = stations[stationKey];
      document.documentElement.lang = language;
      document.getElementById("brandLine").textContent = text.brand;
      document.getElementById("lang-es").setAttribute("aria-pressed", String(language === "es"));
      document.getElementById("lang-en").setAttribute("aria-pressed", String(language === "en"));
      document.getElementById("notice").textContent = text.notice;

      if (!stationKey) {
        document.getElementById("content").innerHTML = `<article class="card"><div class="empty"><strong>${text.scanTitle}</strong>${text.scanText}</div></article>`;
        return;
      }

      if (!item) {
        document.getElementById("content").innerHTML = `<article class="card"><div class="empty"><strong>${text.invalidTitle}</strong>${text.invalidText}</div></article>`;
        return;
      }

      document.title = `${item.label[language]} · Sigsihuayco`;
      document.getElementById("content").innerHTML = `
        <article class="card">
          <div class="head">
            <span class="number">${item.label[language]}</span>
            <h2>${item.title[language]}</h2>
            <p class="place">${item.place[language]}</p>
          </div>
          <div class="player">
            <audio controls preload="metadata" controlsList="nodownload noplaybackrate" disablePictureInPicture oncontextmenu="return false">
              <source src="${audioPath(item)}" type="audio/mpeg">
            </audio>
          </div>
          <p class="instruction">${text.instruction}</p>
        </article>`;
    }

    document.getElementById("lang-es").addEventListener("click", () => { language = "es"; render(); });
    document.getElementById("lang-en").addEventListener("click", () => { language = "en"; render(); });
    document.addEventListener("dragstart", event => event.preventDefault());
    render();
  </script>
</body>
</html>
