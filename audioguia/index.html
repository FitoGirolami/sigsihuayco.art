<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Audioguía · Cavernas de Sigsihuayco</title>
  <meta name="description" content="Audioguía cultural y geológica de las Cavernas de Sigsihuayco, Baños de Agua Santa.">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#0d1514">
  <style>
    :root {
      color-scheme: dark;
      --fondo: #09100f;
      --panel: rgba(13, 24, 22, .96);
      --panel-2: #111e1b;
      --claro: #f4f0e6;
      --suave: #b9c5c0;
      --ocre: #d2a25b;
      --verde: #2f6a60;
      --borde: rgba(210, 162, 91, .34);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(55, 112, 100, .45), transparent 42%),
        linear-gradient(160deg, #101c1a 0%, var(--fondo) 55%, #050807 100%);
      color: var(--claro);
      font-family: Arial, Helvetica, sans-serif;
    }
    a { color: inherit; }
    button, audio { font: inherit; }
    .shell { width: min(760px, 100%); margin: 0 auto; padding: 22px 16px 56px; }
    .top {
      display: grid;
      grid-template-columns: 68px 1fr;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
    }
    .eyebrow {
      margin: 0 0 5px;
      color: var(--ocre);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font: 500 clamp(1.75rem, 7vw, 2.9rem)/1 Georgia, serif; }
    .language {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 22px 0;
      padding: 5px;
      border: 1px solid var(--borde);
      border-radius: 999px;
      background: rgba(0, 0, 0, .22);
    }
    .language button {
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--suave);
      font-weight: 800;
      cursor: pointer;
    }
    .language button[aria-pressed="true"] { background: var(--ocre); color: #17110a; }
    .intro {
      margin: 0 0 24px;
      color: var(--suave);
      font-size: .96rem;
      line-height: 1.65;
    }
    .station-list { display: grid; gap: 16px; }
    .station {
      overflow: hidden;
      border: 1px solid var(--borde);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 52px rgba(0, 0, 0, .25);
    }
    .station-head { padding: 21px 21px 12px; }
    .number {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      margin-bottom: 11px;
      padding: 4px 9px;
      border: 1px solid rgba(210, 162, 91, .45);
      border-radius: 999px;
      color: var(--ocre);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    h2 { margin: 0; font: 500 clamp(1.48rem, 6vw, 2.05rem)/1.13 Georgia, serif; }
    .place { margin: 9px 0 0; color: var(--suave); font-size: .88rem; line-height: 1.45; }
    .player-wrap { padding: 8px 21px 22px; }
    audio { display: block; width: 100%; min-height: 54px; color-scheme: dark; }
    .listening-note { margin: 13px 0 0; color: #8fa19a; font-size: .73rem; line-height: 1.45; }
    .station-tools {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 14px;
      align-items: center;
      padding: 16px 21px;
      border-top: 1px solid rgba(255, 255, 255, .07);
      background: var(--panel-2);
    }
    .qr { width: 86px; height: 86px; padding: 5px; border-radius: 8px; background: #fff; }
    .qr-label { margin: 0; color: var(--suave); font-size: .78rem; line-height: 1.45; }
    .qr-label strong { display: block; margin-bottom: 4px; color: var(--claro); font-size: .85rem; }
    .nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 20px;
    }
    .nav a {
      display: grid;
      place-items: center;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--borde);
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-size: .82rem;
      font-weight: 800;
    }
    .nav .all { grid-column: 1 / -1; color: var(--ocre); }
    .footer {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, .1);
      color: #85958f;
      text-align: center;
      font-size: .75rem;
      line-height: 1.55;
    }
    .footer a { color: var(--ocre); text-underline-offset: 3px; }
    .noscript { padding: 18px; border: 1px solid #9b613f; background: #2d1911; }
    @media (min-width: 620px) {
      .shell { padding-top: 34px; }
      .station-head { padding: 28px 28px 14px; }
      .player-wrap { padding: 10px 28px 27px; }
      .station-tools { padding: 18px 28px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <img class="logo" src="../assets/logo-sigsihuayco.jpeg" alt="Cavernas de Sigsihuayco">
      <div>
        <p class="eyebrow">Baños de Agua Santa · Ecuador</p>
        <h1>Audioguía Sigsihuayco</h1>
      </div>
    </header>

    <div class="language" role="group" aria-label="Idioma / Language">
      <button id="lang-es" type="button" aria-pressed="true">Español</button>
      <button id="lang-en" type="button" aria-pressed="false">English</button>
    </div>

    <p class="intro" id="intro"></p>
    <main class="station-list" id="stations"></main>
    <nav class="nav" id="navigation" aria-label="Navegación de estaciones"></nav>

    <footer class="footer">
      <span id="footer-copy"></span><br>
      <a href="qrs.html" id="qr-sheet">Códigos QR para impresión</a>
    </footer>
    <noscript><p class="noscript">Esta audioguía necesita JavaScript para mostrar los reproductores.</p></noscript>
  </div>

  <script>
    (() => {
      'use strict';
      const stations = [
        { id: '0', badge: ['Bienvenida', 'Welcome'], title: ['Bienvenida a Sigsihuayco', 'Welcome to Sigsihuayco'], place: ['Inicio de la experiencia', 'Beginning of the experience'], es: '../audios/es/00-bienvenida.mp3', en: '../audios/en/00-welcome.mp3', qr: 'qr/00-bienvenida.png' },
        { id: '1', badge: ['Estación 1', 'Station 1'], title: ['El jardín y Pachi', 'The Garden and Pachi'], place: ['Jardines de la propiedad', 'Property gardens'], es: '../audios/es/01-jardin-y-pachi.mp3', en: '../audios/en/01-garden-and-pachi.mp3', qr: 'qr/01-jardin-y-pachi.png' },
        { id: '2', badge: ['Estación 2', 'Station 2'], title: ['Mirador del Pastaza', 'Pastaza Viewpoint'], place: ['Vista al antiguo puente de San Francisco', 'View of the old San Francisco Bridge'], es: '../audios/es/02-mirador-del-pastaza.mp3', en: '../audios/en/02-pastaza-viewpoint.mp3', qr: 'qr/02-mirador-del-pastaza.png' },
        { id: '3', badge: ['Estación 3', 'Station 3'], title: ['Un territorio geológico', 'A Geological Territory'], place: ['Antes del ingreso a la caverna', 'Before entering the cavern'], es: '../audios/es/03-territorio-geologico.mp3', en: '../audios/en/03-geological-territory.mp3', qr: 'qr/03-territorio-geologico.png' },
        { id: '4', badge: ['Estación 4', 'Station 4'], title: ['Leer la caverna', 'Reading the Cavern'], place: ['Primer sector interior', 'First interior section'], es: '../audios/es/04-leer-la-caverna.mp3', en: '../audios/en/04-reading-the-cavern.mp3', qr: 'qr/04-leer-la-caverna.png' },
        { id: '5', badge: ['Estación 5', 'Station 5'], title: ['La memoria de un nombre', 'The Memory of a Name'], place: ['Interior de la caverna', 'Inside the cavern'], es: '../audios/es/05-memoria-del-nombre.mp3', en: '../audios/en/05-memory-of-the-name.mp3', qr: 'qr/05-memoria-del-nombre.png' },
        { id: '6', badge: ['Estación 6', 'Station 6'], title: ['De la memoria a la leyenda', 'From Memory to Legend'], place: ['Interior de la caverna', 'Inside the cavern'], es: '../audios/es/06-de-la-memoria-a-la-leyenda.mp3', en: '../audios/en/06-from-memory-to-legend.mp3', qr: 'qr/06-de-la-memoria-a-la-leyenda.png' },
        { id: '7', badge: ['Estación 7', 'Station 7'], title: ['La expedición', 'The Expedition'], place: ['Interior de la caverna', 'Inside the cavern'], es: '../audios/es/07-la-expedicion.mp3', en: '../audios/en/07-the-expedition.mp3', qr: 'qr/07-la-expedicion.png' },
        { id: '8', badge: ['Estación 8', 'Station 8'], title: ['El sobreviviente', 'The Survivor'], place: ['Interior de la caverna', 'Inside the cavern'], es: '../audios/es/08-el-sobreviviente.mp3', en: '../audios/en/08-the-survivor.mp3', qr: 'qr/08-el-sobreviviente.png' },
        { id: '9', badge: ['Estación 9', 'Station 9'], title: ['La recuperación de Sigsihuayco', 'The Recovery of Sigsihuayco'], place: ['Final del recorrido', 'End of the route'], es: '../audios/es/09-recuperacion-de-sigsihuayco.mp3', en: '../audios/en/09-recovery-of-sigsihuayco.mp3', qr: 'qr/09-recuperacion-de-sigsihuayco.png' },
        { id: 't', badge: ['Estación especial', 'Special Station'], title: ['El tesoro de Atahualpa', 'Atahualpa’s Treasure'], place: ['Escultura de piedra inspirada en el mundo inca', 'Stone sculpture inspired by the Inca world'], es: '../audios/es/especial-tesoro-de-atahualpa.mp3', en: '../audios/en/special-atahualpas-treasure.mp3', qr: 'qr/especial-tesoro-de-atahualpa.png' }
      ];

      const copy = {
        es: {
          intro: 'Escucha cada estación a tu propio ritmo. Utiliza audífonos, cuida el volumen y sigue siempre las indicaciones del personal.',
          listen: 'Contenido disponible para escucha durante la visita. No se autoriza su descarga, copia ni redistribución.',
          qrTitle: 'QR de esta estación',
          qrText: 'Este código abre directamente este punto de la audioguía.',
          previous: '← Estación anterior',
          next: 'Estación siguiente →',
          all: 'Ver todas las estaciones',
          footer: 'Audioguía cultural y geológica · Cavernas de Sigsihuayco',
          sheet: 'Códigos QR para impresión'
        },
        en: {
          intro: 'Listen to each station at your own pace. Use headphones, keep the volume comfortable, and always follow staff instructions.',
          listen: 'Available for listening during your visit. Downloading, copying, or redistribution is not authorized.',
          qrTitle: 'Station QR code',
          qrText: 'This code opens this point of the audio guide directly.',
          previous: '← Previous station',
          next: 'Next station →',
          all: 'View all stations',
          footer: 'Cultural and geological audio guide · Sigsihuayco Caverns',
          sheet: 'Printable QR codes'
        }
      };

      const indexFor = lang => lang === 'es' ? 0 : 1;
      const validIds = new Set(stations.map(station => station.id));
      const requested = new URLSearchParams(location.search).get('s');
      const selectedId = validIds.has(requested) ? requested : null;
      let language = localStorage.getItem('sigsihuayco-language') || (navigator.language.toLowerCase().startsWith('en') ? 'en' : 'es');
      if (!['es', 'en'].includes(language)) language = 'es';

      const stationHost = document.getElementById('stations');
      const navigation = document.getElementById('navigation');
      const intro = document.getElementById('intro');
      const footerCopy = document.getElementById('footer-copy');
      const qrSheet = document.getElementById('qr-sheet');
      const esButton = document.getElementById('lang-es');
      const enButton = document.getElementById('lang-en');

      function stopOtherAudio(current) {
        document.querySelectorAll('audio').forEach(audio => {
          if (audio !== current) audio.pause();
        });
      }

      function stationCard(station) {
        const i = indexFor(language);
        const article = document.createElement('article');
        article.className = 'station';
        article.id = `station-${station.id}`;

        const head = document.createElement('div');
        head.className = 'station-head';
        const badge = document.createElement('span');
        badge.className = 'number';
        badge.textContent = station.badge[i];
        const title = document.createElement('h2');
        title.textContent = station.title[i];
        const place = document.createElement('p');
        place.className = 'place';
        place.textContent = station.place[i];
        head.append(badge, title, place);

        const playerWrap = document.createElement('div');
        playerWrap.className = 'player-wrap';
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'metadata';
        audio.src = station[language];
        audio.setAttribute('controlsList', 'nodownload noplaybackrate');
        audio.setAttribute('disablePictureInPicture', '');
        audio.setAttribute('aria-label', `${station.badge[i]}: ${station.title[i]}`);
        audio.addEventListener('contextmenu', event => event.preventDefault());
        audio.addEventListener('dragstart', event => event.preventDefault());
        audio.addEventListener('play', () => stopOtherAudio(audio));
        const note = document.createElement('p');
        note.className = 'listening-note';
        note.textContent = copy[language].listen;
        playerWrap.append(audio, note);

        const tools = document.createElement('div');
        tools.className = 'station-tools';
        const qr = document.createElement('img');
        qr.className = 'qr';
        qr.src = station.qr;
        qr.alt = `${copy[language].qrTitle}: ${station.title[i]}`;
        qr.loading = 'lazy';
        qr.draggable = false;
        const label = document.createElement('p');
        label.className = 'qr-label';
        const strong = document.createElement('strong');
        strong.textContent = copy[language].qrTitle;
        label.append(strong, document.createTextNode(copy[language].qrText));
        tools.append(qr, label);

        article.append(head, playerWrap, tools);
        return article;
      }

      function renderNavigation() {
        navigation.replaceChildren();
        if (!selectedId) return;
        const position = stations.findIndex(station => station.id === selectedId);
        if (position > 0) {
          const previous = document.createElement('a');
          previous.href = `?s=${stations[position - 1].id}`;
          previous.textContent = copy[language].previous;
          navigation.append(previous);
        }
        if (position < stations.length - 1) {
          const next = document.createElement('a');
          next.href = `?s=${stations[position + 1].id}`;
          next.textContent = copy[language].next;
          navigation.append(next);
        }
        const all = document.createElement('a');
        all.href = './';
        all.className = 'all';
        all.textContent = copy[language].all;
        navigation.append(all);
      }

      function render() {
        document.documentElement.lang = language;
        esButton.setAttribute('aria-pressed', String(language === 'es'));
        enButton.setAttribute('aria-pressed', String(language === 'en'));
        intro.textContent = copy[language].intro;
        footerCopy.textContent = copy[language].footer;
        qrSheet.textContent = copy[language].sheet;
        stationHost.replaceChildren();
        const visible = selectedId ? stations.filter(station => station.id === selectedId) : stations;
        visible.forEach(station => stationHost.append(stationCard(station)));
        renderNavigation();
      }

      function changeLanguage(next) {
        document.querySelectorAll('audio').forEach(audio => audio.pause());
        language = next;
        localStorage.setItem('sigsihuayco-language', language);
        render();
      }

      esButton.addEventListener('click', () => changeLanguage('es'));
      enButton.addEventListener('click', () => changeLanguage('en'));
      render();
    })();
  </script>
</body>
</html>
