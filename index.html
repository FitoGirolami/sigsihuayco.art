<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sigsihuayco · Sitio en progreso</title>
  <meta name="description" content="Sitio cultural de las Cavernas de Sigsihuayco, Baños de Agua Santa. Próximamente.">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0b1412">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 50% 0%, rgba(59, 119, 106, .38), transparent 42%),
        linear-gradient(160deg, #111f1c, #07100e 62%, #030605);
      color: #f4f0e6;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    main { width: min(560px, 100%); }
    img {
      width: 126px;
      height: 126px;
      object-fit: cover;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 18px 55px rgba(0, 0, 0, .38);
    }
    .eyebrow {
      margin: 28px 0 12px;
      color: #d2a25b;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font: 500 clamp(2.35rem, 10vw, 4.4rem)/.95 Georgia, serif; }
    .line { width: 52px; height: 1px; margin: 28px auto; background: rgba(210, 162, 91, .65); }
    p { margin: 0 auto; max-width: 470px; color: #bec9c4; font-size: 1rem; line-height: 1.7; }
    .en { margin-top: 16px; color: #8fa19a; font-size: .87rem; }
  </style>
</head>
<body>
  <main>
    <img src="assets/logo-sigsihuayco.jpeg" alt="Caverna Sigsihuayco">
    <p class="eyebrow">Baños de Agua Santa · Ecuador</p>
    <h1>Sigsihuayco</h1>
    <div class="line"></div>
    <p>Estamos preparando un sitio dedicado a la geología, la memoria cultural y las leyendas de las Cavernas de Sigsihuayco.</p>
    <p class="en" lang="en">We are preparing a site dedicated to the geology, cultural memory, and legends of the Sigsihuayco Caverns.</p>
  </main>
</body>
</html>
